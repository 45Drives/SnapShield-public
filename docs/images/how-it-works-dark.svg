<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How SnapShield works</title>
<desc id="d">Watch file changes on Samba shares, score them against snapshots, stop suspicious clients, and recover files from snapshots.</desc>
<rect x="22.0" y="20" width="196" height="236" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="40.0" y="20" width="160" height="5" rx="2.5" fill="#4493f8"/>
<circle cx="120.0" cy="82" r="30" fill="#0c2d6b"/><path d="M102.0,82 Q120.0,66 138.0,82 Q120.0,98 102.0,82 Z" stroke="#4493f8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120.0" cy="82" r="5" fill="#4493f8"/>
<text x="120.0" y="144" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4493f8">1 · WATCH</text>
<text x="120.0" y="172" text-anchor="middle" font-size="14" fill="#e6edf3">SnapShield's Samba</text>
<text x="120.0" y="192" text-anchor="middle" font-size="14" fill="#e6edf3">module sees every</text>
<text x="120.0" y="212" text-anchor="middle" font-size="14" fill="#e6edf3">file change on your</text>
<text x="120.0" y="232" text-anchor="middle" font-size="14" fill="#e6edf3">protected shares.</text>
<line x1="226.0" y1="138.0" x2="246.0" y2="138.0" stroke="#6e7681" stroke-width="2.5"/>
<path d="M244.0,131.0 L254.0,138.0 L244.0,145.0 Z" fill="#6e7681"/>
<rect x="262.0" y="20" width="196" height="236" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="280.0" y="20" width="160" height="5" rx="2.5" fill="#d29922"/>
<circle cx="360.0" cy="82" r="30" fill="#3b2300"/><path d="M343.0,90 A18,18 0 1 1 377.0,90" stroke="#d29922" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="360.0" y1="86" x2="369.0" y2="73" stroke="#d29922" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360.0" cy="86" r="3.5" fill="#d29922"/>
<text x="360.0" y="144" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d29922">2 · SCORE</text>
<text x="360.0" y="172" text-anchor="middle" font-size="14" fill="#e6edf3">Each change is scored</text>
<text x="360.0" y="192" text-anchor="middle" font-size="14" fill="#e6edf3">against your snapshots,</text>
<text x="360.0" y="212" text-anchor="middle" font-size="14" fill="#e6edf3">with behaviour checks</text>
<text x="360.0" y="232" text-anchor="middle" font-size="14" fill="#e6edf3">and decoy honeyfiles.</text>
<line x1="466.0" y1="138.0" x2="486.0" y2="138.0" stroke="#6e7681" stroke-width="2.5"/>
<path d="M484.0,131.0 L494.0,138.0 L484.0,145.0 Z" fill="#6e7681"/>
<rect x="502.0" y="20" width="196" height="236" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="520.0" y="20" width="160" height="5" rx="2.5" fill="#f85149"/>
<circle cx="600.0" cy="82" r="30" fill="#4c0f13"/><path d="M600.0,63 L615.0,69 L615.0,83 Q615.0,95 600.0,101 Q585.0,95 585.0,83 L585.0,69 Z" stroke="#f85149" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="593.0" y1="82" x2="607.0" y2="82" stroke="#f85149" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600.0" y="144" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#f85149">3 · STOP</text>
<text x="600.0" y="172" text-anchor="middle" font-size="14" fill="#e6edf3">Suspicious clients are</text>
<text x="600.0" y="192" text-anchor="middle" font-size="14" fill="#e6edf3">banned before the</text>
<text x="600.0" y="212" text-anchor="middle" font-size="14" fill="#e6edf3">attack spreads, and</text>
<text x="600.0" y="232" text-anchor="middle" font-size="14" fill="#e6edf3">you are alerted.</text>
<line x1="706.0" y1="138.0" x2="726.0" y2="138.0" stroke="#6e7681" stroke-width="2.5"/>
<path d="M724.0,131.0 L734.0,138.0 L724.0,145.0 Z" fill="#6e7681"/>
<rect x="742.0" y="20" width="196" height="236" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="760.0" y="20" width="160" height="5" rx="2.5" fill="#3fb950"/>
<circle cx="840.0" cy="82" r="30" fill="#033a16"/><path d="M826.0,76 A16,16 0 1 1 830.0,94" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M819.0,68 L826.0,77 L835.0,71" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840.0" y="144" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3fb950">4 · RECOVER</text>
<text x="840.0" y="172" text-anchor="middle" font-size="14" fill="#e6edf3">Restore affected files</text>
<text x="840.0" y="192" text-anchor="middle" font-size="14" fill="#e6edf3">from snapshots in the</text>
<text x="840.0" y="212" text-anchor="middle" font-size="14" fill="#e6edf3">SnapShield dashboard.</text>
<text x="840.0" y="232" text-anchor="middle" font-size="14" fill="#e6edf3"></text>
<rect x="22.0" y="282" width="916" height="74" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="120.0" y="312" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#9198a1">RUNS ON</text>
<text x="120.0" y="334" text-anchor="middle" font-size="14" fill="#e6edf3">your Samba file server</text>
<text x="360.0" y="312" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#9198a1">USES</text>
<text x="360.0" y="334" text-anchor="middle" font-size="14" fill="#e6edf3">ZFS or Ceph snapshots</text>
<text x="600.0" y="312" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#9198a1">MANAGED IN</text>
<text x="600.0" y="334" text-anchor="middle" font-size="14" fill="#e6edf3">Cockpit on each server</text>
<text x="840.0" y="312" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#9198a1">OPTIONAL</text>
<text x="840.0" y="334" text-anchor="middle" font-size="14" fill="#e6edf3">Control Panel for fleets</text>
</svg>
