name: Feature request
description: Suggest an idea or improvement for SnapShield.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/45Drives/SnapShield-public/issues?q=is%3Aissue) first. If your idea is already there, add a 👍 to it — that's how we gauge demand.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Installation / setup wizard
        - SnapShield dashboard
        - Detection / blocking / honeyfiles
        - Control Panel
        - Licensing
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, how other tools handle it, screenshots or mock-ups.
